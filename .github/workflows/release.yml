# Builds MapStash.exe on Windows and attaches it to a GitHub Release
# whenever you push a version tag like v1.0.0
name: Build release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt
          python -m PyInstaller --onefile --windowed --name MapStash --icon assets/icon.ico --add-data "ui;ui" mapstash.pyw

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapStash-windows
          path: dist/MapStash.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MapStash.exe
          generate_release_notes: true
